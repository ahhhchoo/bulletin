<title>Bulletin Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column. A big ghosted count up top (the shelf cards' "Oct26" move), three hero cards for what's
   next, then quiet sections. Sticky-note tones mark each section; black is the only action color, as in the app. */
:root{
  --paper:#f5f5f5; --card:#ffffff; --ink:#0b0b0c; --ink-2:rgba(11,11,12,.56); --ink-3:rgba(11,11,12,.34);
  --line:rgba(11,11,12,.09); --ghost:rgba(11,11,12,.13); --blue:#0078fc;
  --butter:#f3e6c4; --blush:#f4d9d6; --sage:#d8e6d3; --sky:#d5e3f1; --lilac:#e3dbef; --peach:#f6dfca;
  --shadow:0 1px 1px rgba(0,0,0,.05),0 8px 24px -8px rgba(0,0,0,.14);
  --ui:"Inter",system-ui,-apple-system,"SF Pro Text",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101011; --card:#1b1b1d; --ink:#f4f4f5; --ink-2:rgba(244,244,245,.6); --ink-3:rgba(244,244,245,.36);
  --line:rgba(244,244,245,.1); --ghost:rgba(244,244,245,.15); --blue:#4c9bff;
  --butter:#4a432c; --blush:#4d3534; --sage:#32402f; --sky:#2c3a49; --lilac:#3b3449; --peach:#4b3a2b;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101011; --card:#1b1b1d; --ink:#f4f4f5; --ink-2:rgba(244,244,245,.6); --ink-3:rgba(244,244,245,.36);
  --line:rgba(244,244,245,.1); --ghost:rgba(244,244,245,.15); --blue:#4c9bff;
  --butter:#4a432c; --blush:#4d3534; --sage:#32402f; --sky:#2c3a49; --lilac:#3b3449; --peach:#4b3a2b;
  --shadow:0 1px 1px rgba(0,0,0,.4),0 10px 28px -10px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--ui);-webkit-font-smoothing:antialiased;margin:0;
  padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;flex-direction:column;gap:18px;padding-top:12px}
.eyebrow{font:500 12px var(--mono);color:var(--ink-3);letter-spacing:.04em}
.count{font-weight:800;letter-spacing:-.055em;line-height:.9;font-size:clamp(88px,26vw,148px);display:flex;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums}
.count .of{color:var(--ghost)}
.count-label{font-size:17px;color:var(--ink-2);max-width:30ch;text-wrap:balance}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .5s cubic-bezier(.3,1.1,.4,1)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:500 13px var(--ui);padding:7px 14px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-2);transition:transform .2s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.tools .sp{flex:1}

/* section titles */
h2{font:600 22px/1.2 var(--ui);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-head small{font:500 12px var(--mono);color:var(--ink-3);margin-left:auto;white-space:nowrap}
.sub{font-size:14px;color:var(--ink-2);margin:4px 0 0;max-width:60ch}

/* checkbox */
.box{flex:none;width:26px;height:26px;border-radius:9px;box-shadow:inset 0 0 0 1.6px var(--ink-3);display:grid;place-items:center;transition:background .2s,box-shadow .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.box svg{width:14px;height:14px;stroke:var(--paper);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .3s .05s}
.item[aria-checked="true"] .box{background:var(--ink);box-shadow:none;transform:scale(1.04)}
.item[aria-checked="true"] .box svg{stroke-dashoffset:0}

/* hero cards */
.heroes{display:flex;flex-direction:column;gap:16px}
.hero{border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.hero.t-butter{background:var(--butter)} .hero.t-sky{background:var(--sky)} .hero.t-blush{background:var(--blush)}
.hero-head{display:flex;align-items:flex-start;gap:12px}
.hero-head h2{font-size:26px;font-weight:700}
.hero-head .tag{margin-left:auto}
.tag{font:500 11px var(--mono);padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--ink);white-space:nowrap;letter-spacing:.02em}
:root[data-theme="dark"] .tag{background:rgba(0,0,0,.28)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{background:rgba(0,0,0,.28)}}
.frames{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.frame{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.phone{aspect-ratio:9/17;border-radius:14px;background:var(--paper);box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 6px 14px -6px rgba(0,0,0,.28);position:relative;overflow:hidden;padding:9% 10%;display:flex;flex-direction:column;gap:7%;align-items:center;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.frame:hover .phone{transform:translateY(-4px) rotate(-1.5deg)}
.frame[aria-checked="true"] .phone{opacity:.55}
.frame .badge{position:absolute;right:6px;top:6px}
.frame[aria-checked="true"] .box{background:var(--ink);box-shadow:none}
.frame[aria-checked="true"] .box svg{stroke-dashoffset:0}
.frame .box{width:20px;height:20px;border-radius:7px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1.4px var(--ink-3)}
.frame .box svg{width:11px;height:11px}
.frame .cap{font:500 11px/1.25 var(--mono);color:var(--ink-2)}
.frame .nm{font:600 12.5px/1.25 var(--ui);color:var(--ink)}
/* little wireframes */
.w-c{width:46%;aspect-ratio:1;border-radius:50%;background:var(--butter)}
.w-l{height:5px;border-radius:9px;background:var(--line);width:100%}
.w-l.s{width:62%} .w-l.xs{width:38%}
.w-f{width:100%;height:13%;border-radius:7px;background:var(--line)}
.w-p{width:70%;height:12%;border-radius:99px;background:var(--ink);margin-top:auto}
.w-p.g{background:var(--line);margin-top:0}
.w-b{align-self:flex-start;width:78%;height:13%;border-radius:8px 8px 8px 2px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.w-b.r{align-self:flex-end;border-radius:8px 8px 2px 8px;background:var(--blush);box-shadow:none;width:60%}
.w-s{width:62%;aspect-ratio:1;border-radius:6px;background:var(--butter);transform:rotate(-4deg);box-shadow:0 3px 6px -3px rgba(0,0,0,.3)}
.w-d{width:80%;height:15%;border-radius:8px;border:1.4px dashed var(--ink-3);margin-top:auto}
.w-row{display:flex;align-items:center;gap:8%;width:100%}
.w-row i{width:26%;aspect-ratio:1;border-radius:50%;background:var(--sage);flex:none}
.w-row i:nth-child(odd){background:var(--sky)}
.w-row b{flex:1;height:5px;border-radius:9px;background:var(--line)}

.rows{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.5)}
:root[data-theme="dark"] .rows{background:rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rows{background:rgba(0,0,0,.18)}}
.hero .item{padding:14px 16px}
.hero .item + .item{border-top:1px solid var(--line)}

.names{display:flex;flex-wrap:wrap;gap:8px}
.name{font-weight:800;letter-spacing:-.04em;font-size:30px;line-height:1;padding:12px 18px;border-radius:16px;background:var(--card);box-shadow:var(--shadow)}
.name:nth-child(2){transform:rotate(-2deg)} .name:nth-child(3){transform:rotate(1.5deg)} .name:nth-child(5){transform:rotate(-1deg)}
.names-note{font:400 12px var(--mono);color:var(--ink-2)}

/* rows */
.item{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:15px 0;transition:opacity .25s}
.item + .item{border-top:1px solid var(--line)}
.item .tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.item .tt{font-weight:500;font-size:16px;letter-spacing:-.01em;text-wrap:pretty}
.item .ds{font-size:13.5px;color:var(--ink-2);text-wrap:pretty}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.item[aria-checked="true"] .tt{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.item[aria-checked="true"] .ds{opacity:.6}
.ans{font:500 13px var(--ui);color:var(--ink);background:var(--butter);align-self:flex-start;padding:3px 10px;border-radius:99px}
.item[aria-checked="true"] .ans{background:var(--line);color:var(--ink-2)}
.code{font:500 11px var(--mono);padding:3px 8px;border-radius:7px;background:var(--line);color:var(--ink-2)}
.k{font:500 11px var(--mono);padding:3px 8px;border-radius:99px;color:var(--ink)}
.k.design{background:var(--blush)} .k.build{background:var(--sky)} .k.decide{background:var(--butter)}
.k.you{background:var(--ink);color:var(--paper)} .k.sug{background:transparent;box-shadow:inset 0 0 0 1px var(--ink-3);color:var(--ink-2)}

/* grouped sections */
.stack{display:flex;flex-direction:column;gap:30px}
.group{display:flex;flex-direction:column}
.group-label{display:flex;align-items:center;gap:10px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-bottom:8px;border-bottom:1px solid var(--line)}
.group-label i{width:12px;height:12px;border-radius:4px;display:block}
.group-label span:last-child{margin-left:auto;font-weight:500;color:var(--ink-3)}
.done-toggle{margin-top:6px;font:500 13px var(--ui);color:var(--ink-2);display:flex;gap:8px;align-items:center}
.save{font:400 12px var(--mono);color:var(--ink-3);text-align:center}
.empty{padding:36px 0;text-align:center;color:var(--ink-2)}

@media (max-width:560px){
  .frames{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}
  .hero{padding:18px;border-radius:24px}
  .hero-head h2{font-size:22px}
  .name{font-size:24px;padding:10px 14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.frame:hover .phone{transform:none}}
</style>

<div class="wrap">

  </header>

  <section id="heroes" class="heroes" aria-label="Next up"></section>
  <main id="sections" class="stack"></main>
  <div class="save" id="save"></div>
</div>

/* ---------- state ---------- */
const state={}; // id -> bool, only for ids that have been touched
let filter="all", hideDone=false, db=null, col=null;
const allItems=()=>[
  ...HERO.onb.frames, ...HERO.find.items, ...HERO.name.items,
  ...SECTIONS.flatMap(s=>s.groups.flatMap(g=>g.items)), ...DONE_DEFAULT
];
const isDone=id=>{ if(id in state) return state[id]; const it=allItems().find(i=>i.id===id); return !!(it&&it.def)||DONE_DEFAULT.some(d=>d.id===id); };
const $=s=>document.querySelector(s);
const saveNote=m=>{$("#save").textContent=m};

/* ---------- render ---------- */
const kinds={design:"design",build:"build",decide:"decide"};
const kindOf=i=>i.k||"design";
const show=i=>filter==="all"||kindOf(i)===filter||(filter==="sug"&&i.sug);
function row(i){
  const done=isDone(i.id);
  return `<button class="item" role="checkbox" aria-checked="${done}" data-id="${i.id}">
    <span class="box">${TICK}</span>
    <span class="tx"><span class="tt">${i.t}</span>${i.ans?`<span class="ans">Decided: ${i.ans}</span>`:""}${i.d?`<span class="ds">${i.d}</span>`:""}
    <span class="meta">${i.code?`<span class="code">${i.code}</span>`:""}<span class="k ${kindOf(i)}">${kindOf(i)}</span>${i.sug?'<span class="k sug">suggested</span>':""}</span></span>
  </button>`;
}
function art(a){
  const A={
   welcome:'<div class="w-c"></div><div class="w-l"></div><div class="w-l s"></div><div class="w-p"></div>',
   profile:'<div class="w-c" style="background:var(--sage)"></div><div class="w-f"></div><div class="w-f"></div><div class="w-p"></div>',
   into:'<div class="w-b"></div><div class="w-b r"></div><div class="w-b"></div><div class="w-p g"></div>',
   addback:'<div class="w-c" style="background:var(--blush)"></div><div class="w-l"></div><div class="w-p"></div><div class="w-p g"></div>',
   invite:'<div class="w-row"><i></i><b></b></div><div class="w-row"><i></i><b></b></div><div class="w-row"><i></i><b></b></div><div class="w-p g"></div>',
   first:'<div class="w-s"></div><div class="w-l s"></div><div class="w-d"></div>'
  }; return A[a];
}
function renderHeroes(){
  const o=HERO.onb, f=HERO.find, n=HERO.name;
  const cnt=a=>`${a.filter(i=>isDone(i.id)).length}/${a.length}`;
  const head=(h,a)=>`<div class="hero-head"><div><h2>${h.title}</h2><p class="sub">${h.sub}</p></div><span class="tag">${cnt(a)}</span></div>`;
  const frames=o.frames.filter(show);
  let html="";
  if(frames.length) html+=`<article class="hero t-${o.tone}">${head(o,o.frames)}<div class="frames">${frames.map(fr=>`
    <button class="frame" role="checkbox" aria-checked="${isDone(fr.id)}" data-id="${fr.id}" aria-label="${fr.code} ${fr.t}">
      <span class="phone">${art(fr.art)}</span>
      <span class="cap">${fr.code}</span><span class="nm">${fr.t}</span>
      <span class="box">${TICK}</span></button>`).join("")}</div></article>`;
  const fi=f.items.filter(show);
  if(fi.length) html+=`<article class="hero t-${f.tone}">${head(f,f.items)}<div class="rows">${fi.map(row).join("")}</div></article>`;
  const ni=n.items.filter(show);
  if(ni.length) html+=`<article class="hero t-${n.tone}">${head(n,n.items)}<div class="names" aria-label="Candidate names">${n.names.map(x=>`<span class="name">${x}</span>`).join("")}</div><div class="names-note">Decided. The spec still says “cover” and “zine” in places.</div><div class="rows">${ni.map(row).join("")}</div></article>`;
  $("#heroes").innerHTML=html;
}
function renderSections(){
  let html="";
  for(const s of SECTIONS){
    const groups=s.groups.map(g=>({...g,items:g.items.filter(i=>show(i)&&!(hideDone&&isDone(i.id)))})).filter(g=>g.items.length);
    if(!groups.length) continue;
    const all=s.groups.flatMap(g=>g.items), d=all.filter(i=>isDone(i.id)).length;
    html+=`<section><div class="sec-head"><div><h2>${s.title}</h2><p class="sub">${s.sub}</p></div><small>${d}/${all.length}</small></div>
      <div class="stack">${groups.map(g=>`<div class="group"><div class="group-label"><i style="background:${g.tone}"></i><span>${g.label}</span><span>${g.items.filter(i=>isDone(i.id)).length}/${g.items.length}</span></div>${g.items.map(row).join("")}</div>`).join("")}</div></section>`;
  }
  const dn=DONE_DEFAULT.filter(i=>show(i)&&!hideDone);
  if(dn.length) html+=`<section><div class="sec-head"><div><h2>Already done</h2><p class="sub">So the count is honest.</p></div><small>${DONE_DEFAULT.filter(i=>isDone(i.id)).length}/${DONE_DEFAULT.length}</small></div><div class="group">${dn.map(row).join("")}</div></section>`;
  $("#sections").innerHTML=html||'<div class="empty">Nothing here. Try another filter.</div>';
}
function renderTop(){
  const items=allItems(), total=items.length, done=items.filter(i=>isDone(i.id)).length;
  $("#done").textContent=done; $("#total").textContent="/"+total;
  $("#fill").style.width=(done/total*100)+"%";
  $("#label").textContent=done===total?"Everything is done.":`${total-done} left to do, ${done} finished so far`;
  $("#tools").innerHTML=[["all","All"],["design","Design"],["build","Build"],["decide","Decide"],["sug","Suggested"]]
    .map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join("")+
    `<span class="sp"></span><button class="chip" id="hide" aria-pressed="${hideDone}">Hide done</button>`;
}
function render(){ renderTop(); renderHeroes(); renderSections(); }

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-id]");
  if(b){ toggle(b.dataset.id); return; }
  const c=e.target.closest("[data-f]");
  if(c){ filter=c.dataset.f; render(); return; }
  if(e.target.closest("#hide")){ hideDone=!hideDone; render(); }
});

/* ---------- saving: shared db when this view has it, this browser otherwise ---------- */
const LS="bulletin-checklist-v1";
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LS)||"{}"); }catch{ return {}; } }
function lsWrite(){ try{ localStorage.setItem(LS,JSON.stringify(state)); }catch{} }
function toggle(id){
  const next=!isDone(id); state[id]=next; render();
  if(col){ col.doc(id).set({done:next}).catch(()=>{ saveNote("Could not save. Kept on this device."); lsWrite(); }); }
  else lsWrite();
}
Object.assign(state,lsRead());
render();
(async()=>{
  try{
    db=await (window.claude&&claude.use?claude.use("db"):null);
    if(!db){ saveNote("Saved on this device."); return; }
    col=db.collection("checklist");
    const timer=setTimeout(()=>saveNote("Can't reach saved ticks yet."),10000);
    col.onSnapshot(snap=>{
      clearTimeout(timer);
      for(const d of snap.docs){ const v=d.data(); if(v&&typeof v.done==="boolean") state[d.id]=v.done; }
      render(); saveNote("Saved. Ticks follow you across devices.");
    },()=>{ clearTimeout(timer); col=null; saveNote("Saved on this device."); });
  }catch{ saveNote("Saved on this device."); }
})();
</script>
